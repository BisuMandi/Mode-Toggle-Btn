<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Mode toggle button</title>
</head>
<body>
    <div class="all">
        <input type="checkbox" name="" id="checkbox" class="checkbox">
        <label for="checkbox" class="checkbox-label">
            <div id="night">
                <i id="night-first" class="fa-solid fa-star"></i>
                <i id="night-second" class="fa-solid fa-star"></i>
                <i id="night-third" class="fa-solid fa-circle"></i>
                <i id="night-fourth" class="fa-solid fa-circle"></i>
                <i id="night-fifth" class="fa-solid fa-circle"></i>
            </div>
            <div id="day">
                <i id="day-first" class="fa-solid fa-circle"></i>
                <i id="day-second" class="fa-solid fa-circle"></i>
            </div>
            <span class="toggle-mode">
                <i id="toggle-icon" class="fa-solid fa-circle"></i>
            </span>
        </label>
    </div>
    <script src="script.js"></script>
</body>
</html>
